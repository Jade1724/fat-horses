[package]
name = "fat-horses-places"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
domain.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }
