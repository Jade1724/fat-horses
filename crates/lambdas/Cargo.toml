[package]
name = "fat-horses-lambdas"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
app.workspace = true
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.126.0"
aws-sdk-sfn = "1.117.0"
aws-sdk-ssm = "1.124.0"
chrono = "0.4.45"
domain.workspace = true
lambda_http = "1.3.1"
lambda_runtime = "1.4.0"
places.workspace = true
race.workspace = true
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
store.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
