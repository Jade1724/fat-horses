[package]
name = "fat-horses-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "fat-horses"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
app.workspace = true
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
domain.workspace = true
places.workspace = true
race.workspace = true
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false }
store.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
