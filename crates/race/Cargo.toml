[package]
name = "fat-horses-race"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
chrono = "0.4.45"
domain.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
